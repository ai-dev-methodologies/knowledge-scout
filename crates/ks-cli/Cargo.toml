[package]
name = "ks-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ks"
path = "src/main.rs"

[dependencies]
ks-core = { path = "../ks-core" }
ks-browser = { path = "../ks-browser" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
redis = "1.8"
rmcp = { version = "3.9", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
