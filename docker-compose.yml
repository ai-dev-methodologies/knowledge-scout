# Redis index for knowledge-scout (required in every mode).
# The official redis:8.x image ships the Query Engine (FT.*) and RedisJSON; `ks index rebuild` relies on both.
# Secrets come from ./.env (gitignored): KS_REDIS_PASSWORD (required), KS_REDIS_PORT (host port, default 6379).
# Optional, for running a second instance beside the personal one (see docs/servers.md): KS_REDIS_CONTAINER (default
# ks-redis) and KS_REDIS_DATA (default ./.ks-data/redis). With the defaults the resolved config is unchanged.
services:
  redis:
    image: redis:8.10.3
    container_name: ${KS_REDIS_CONTAINER:-ks-redis}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KS_REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${KS_REDIS_PASSWORD:?set KS_REDIS_PASSWORD in .env}
    # The config file is written inside the container so the password never appears in process arguments.
    # Search parity needs explicit module args: a wildcard query silently truncates at MAXPREFIXEXPANSIONS
    # (default 200) and a timeout silently returns partial results, so raise the cap and fail on timeout. The timeout is
    # finite (10 s) so a runaway query cannot hang the server. ks only verifies these at search time, never changes them.
    command:
      - sh
      - -c
      - |
        umask 077
        {
          printf 'requirepass %s\n' "$$REDIS_PASSWORD"
          echo 'appendonly yes'
          echo 'loadmodule /usr/local/lib/redis/modules/redisearch.so MAXPREFIXEXPANSIONS 1000000000 TIMEOUT 10000 ON_TIMEOUT FAIL'
          echo 'loadmodule /usr/local/lib/redis/modules/rejson.so'
        } > /tmp/ks.conf
        exec redis-server /tmp/ks.conf
    volumes:
      - ${KS_REDIS_DATA:-./.ks-data/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
